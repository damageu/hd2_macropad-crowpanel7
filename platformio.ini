; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = LVGL-320-480
default_envs = LVGL-320-480
boards_dir = boards
data_dir = littlefs
lib_dir = libraries
src_dir = src

[env:LVGL-320-480]
platform = espressif32@6.9.0
board = 320x480
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = debug
board_build.filesystem = littlefs
board_build.partitions = partitions/default_16MB.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
	-DLV_CONF_PATH='${PROJECT_DIR}/src/lv_conf.h'
	-DEEZ_PLATFORM_ESP32
	-DEEZ_FOR_LVGL
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-Wno-maybe-uninitialized
extra_scripts = 
	pre:utils/write-version.py
	utils/merge-bin.py
monitor_speed = 115200
upload_speed = 921600

; Elecrow CrowPanel Advance 7.0 (DIS02170A PCB V1.3): RGB 800x480, GT911, STC8.
; The 480x320 UI is scaled 1.5x into a centred 720x480 window.
; USB-C is a CH340 serial bridge. Connectivity "USB" talks to HD2 Macropad Link.
; It is not native USB HID. Do not use Bluetooth for this board.
; Esptool upload is 460800. 921600 corrupts reads on the maintainer PC.
; The Link protocol itself stays at 115200 inside serial_link_cp7.c.
; About-screen version is v1.9.1-cp7.2 (see utils/write-version.py). That label
; is this rebase, not the hardware-tested v1.8.6-cp7.2 binary.
[env:crowpanel-adv7]
platform = espressif32@6.9.0
board = crowpanel_adv7
monitor_filters = esp32_exception_decoder
framework = espidf
build_type = debug
board_build.partitions = partitions/crowpanel_adv7_16MB.csv
build_flags =
	-DBOARD_HAS_PSRAM
	-DBOARD_CROWPANEL_ADV7
	-DCP_FORCE_REV=13
	-DLV_CONF_PATH='${PROJECT_DIR}/src/lv_conf.h'
	-DEEZ_PLATFORM_ESP32
	-DEEZ_FOR_LVGL
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-Wno-maybe-uninitialized
extra_scripts =
	pre:utils/write-version.py
	utils/merge-bin.py
monitor_speed = 115200
upload_speed = 460800
